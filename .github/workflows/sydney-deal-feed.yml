name: Update Sydney flight deal feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sydney-deal-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update feed
        run: python3 scripts/update_sydney_feed.py --output feed/sydney-deals.xml

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/sydney-deals.xml
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Sydney flight deal feed"
            git push
          fi
